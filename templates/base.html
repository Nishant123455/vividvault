<!-- footer -->
{% include 'includes/footer.html' %}

<!-- Footer visibility logic -->
<script>
(function () {
    const footer = document.querySelector('.section-footer');

    if (!footer) return;

    function toggleFooter() {
        const scrollTop = window.scrollY;
        const windowHeight = window.innerHeight;
        const docHeight = document.documentElement.scrollHeight;

        // Short page → always show
        if (docHeight <= windowHeight + 5) {
            footer.classList.add('show-footer');
            return;
        }

        // Show only at bottom
        if (scrollTop + windowHeight >= docHeight - 10) {
            footer.classList.add('show-footer');
        } else {
            footer.classList.remove('show-footer');
        }
    }

    window.addEventListener('load', toggleFooter);
    window.addEventListener('scroll', toggleFooter);
    window.addEventListener('resize', toggleFooter);
})();

window.addEventListener("scroll", function () {
    const navbar = document.querySelector(".header-main");

    if (window.scrollY > 40) {
        navbar.classList.add("navbar-scrolled");
    } else {
        navbar.classList.remove("navbar-scrolled");
    }
});


document.addEventListener("DOMContentLoaded", function () {

    const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;

    // PLUS BUTTON
    document.querySelectorAll(".btn-plus").forEach(btn => {
        btn.addEventListener("click", function () {
            updateCart(this.dataset.cartId, "plus", this);
        });
    });

    // MINUS BUTTON
    document.querySelectorAll(".btn-minus").forEach(btn => {
        btn.addEventListener("click", function () {
            updateCart(this.dataset.cartId, "minus", this);
        });
    });

    function updateCart(cartId, action, button) {

        fetch("/cart/update-cart/", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": csrftoken,
            },
            body: `cart_item_id=${cartId}&action=${action}`
        })
        .then(response => response.json())
        .then(data => {

            // REMOVE ITEM
            if (data.removed) {
                button.closest("tr").remove();
                return;
            }

            // UPDATE QUANTITY
            const row = button.closest("tr");
            row.querySelector(".quantity-input").value = data.quantity;

            // UPDATE SUBTOTAL
            row.querySelector(".pricee").innerText = "$ " + data.sub_total;

            // UPDATE TOTALS
            document.getElementById("cart-total").innerText = data.total;
            document.getElementById("cart-tax").innerText = data.tax;
            document.getElementById("cart-grand-total").innerText = data.grand_total;

        })
        .catch(error => console.error("Error:", error));
    }

});


</script>

</body>
